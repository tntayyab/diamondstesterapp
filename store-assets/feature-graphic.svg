    <text x="110" y="118" font-size="13" letter-spacing="1.8" font-weight="700" fill="#6ee7b7">AI SPIDER IDENTIFICATION</text>

    <text x="68" y="224" font-size="78" font-weight="800" fill="#ffffff">Spider</text>
    <text x="68" y="300" font-size="78" font-weight="800" fill="#34d399">Identifier</text>

    <text x="72" y="350" font-size="23" font-weight="500" fill="#c7d6d0">Identify any spider from a photo — instantly.</text>
    <text x="72" y="394" font-size="18" font-weight="600" fill="#8aa79c">Snap a photo  ·  AI identifies  ·  Learn the species</text>
