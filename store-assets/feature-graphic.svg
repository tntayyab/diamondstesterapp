  <path d="M808,244 L804,256 M822,244 L826,256" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>

  <!-- text -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="72" y="96" width="286" height="34" rx="17" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-width="1.5"/>
