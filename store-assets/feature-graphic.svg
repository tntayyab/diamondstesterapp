  <g stroke="#34d399" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M808,214 C772,196 735,176 712,146"/>
    <path d="M802,230 C752,218 712,214 686,200"/>
    <path d="M802,256 C742,258 704,270 682,270"/>
    <path d="M806,280 C762,300 728,326 712,354"/>
    <path d="M822,214 C858,196 895,176 918,146"/>
    <path d="M828,230 C878,218 918,214 944,200"/>
    <path d="M828,256 C888,258 926,270 948,270"/>
    <path d="M824,280 C868,300 902,326 918,354"/>
