<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1b15"/>
      <stop offset="0.55" stop-color="#0a130f"/>
      <stop offset="1" stop-color="#050907"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#34d399" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="body" cx="0.5" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#22392e"/>
      <stop offset="1" stop-color="#0b1510"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>
  <ellipse cx="815" cy="250" rx="300" ry="250" fill="url(#glow)"/>

  <!-- spider web backdrop -->
