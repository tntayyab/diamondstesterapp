  <path d="M815,265 L806,300 L815,320 L824,300 Z" fill="#10b981" opacity="0.6"/>
  <circle cx="815" cy="335" r="5" fill="#10b981" opacity="0.5"/>
  <circle cx="808" cy="206" r="3.2" fill="#6ee7b7"/>
