    <line x1="815" y1="250" x2="965" y2="405"/>
    <line x1="815" y1="250" x2="815" y2="470"/>
    <line x1="815" y1="250" x2="665" y2="405"/>
    <line x1="815" y1="250" x2="600" y2="250"/>
    <line x1="815" y1="250" x2="665" y2="95"/>
    <line x1="815" y1="250" x2="815" y2="30"/>
